<!DOCTYPE html><html data-theme="dark"><head>
<meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0}a{color:var(--text-link)}</style>
</head><body>
<div style="width:1600px;height:900px;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);display:flex;flex-direction:column;justify-content:space-between;padding:80px;box-sizing:border-box">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:18px">
      <img src="../../assets/mark-inverse.svg" width="36" height="36" alt="">
      <span style="font-weight:700;font-size:26px;letter-spacing:0.05em">METABASIS</span>
    </div>
    <span style="font-family:var(--font-mono);font-size:18px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted)">Q2 2026</span>
  </div>
  <div style="text-align:left">
    <div style="font-family:var(--font-mono);font-size:22px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted)">Median order-to-ack latency</div>
    <div style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:240px;font-weight:500;letter-spacing:-0.02em;line-height:1;margin-top:16px">412<span style="color:var(--accent)">µs</span></div>
    <div style="font-size:26px;color:var(--text-secondary);margin-top:24px">Measured across all NY4 co-located sessions, June 2026.</div>
  </div>
  <div style="font-family:var(--font-mono);font-size:20px;color:var(--text-secondary)">metabasis.com</div>
</div>
</body></html>

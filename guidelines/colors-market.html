<!-- @dsCard group="Colors" viewport="700x170" subtitle="Green up / red down, both modes" name="Market semantics" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-mono);font-size:12px}</style></head>
<body><div style="display:grid;grid-template-columns:1fr 1fr;height:170px">
<div style="background:var(--surface-card);padding:14px;display:flex;flex-direction:column;gap:8px">
  <span style="color:var(--up);font-variant-numeric:tabular-nums">▲ +1.42%&nbsp;&nbsp;6,104.25</span>
  <span style="color:var(--down);font-variant-numeric:tabular-nums">▼ −0.87%&nbsp;&nbsp;1.0842</span>
  <span style="display:inline-flex;gap:8px"><span style="background:var(--up-subtle);color:var(--up);padding:2px 8px">FILLED</span><span style="background:var(--down-subtle);color:var(--down);padding:2px 8px">REJECTED</span><span style="background:var(--warn-subtle);color:var(--warn);padding:2px 8px">PENDING</span></span>
</div>
<div data-theme="dark" style="background:var(--surface-page);padding:14px;display:flex;flex-direction:column;gap:8px">
  <span style="color:var(--up);font-variant-numeric:tabular-nums">▲ +1.42%&nbsp;&nbsp;6,104.25</span>
  <span style="color:var(--down);font-variant-numeric:tabular-nums">▼ −0.87%&nbsp;&nbsp;1.0842</span>
  <span style="display:inline-flex;gap:8px"><span style="background:var(--up-subtle);color:var(--up);padding:2px 8px">FILLED</span><span style="background:var(--down-subtle);color:var(--down);padding:2px 8px">REJECTED</span><span style="background:var(--warn-subtle);color:var(--warn);padding:2px 8px">PENDING</span></span>
</div>
</div></body></html>

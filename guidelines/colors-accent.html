<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-mono);font-size:10px;background:var(--gray-0)}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(5,1fr);height:110px">
<div style="background:var(--blue-300);color:#1B3F95;padding:8px">300</div>
<div style="background:var(--blue-400);color:#FAFBFB;padding:8px">400<div>dark accent</div></div>
<div style="background:var(--blue-500);color:#FAFBFB;padding:8px">500</div>
<div style="background:var(--blue-600);color:#FAFBFB;padding:8px">600<div>light accent</div></div>
<div style="background:var(--blue-700);color:#A9C0F2;padding:8px">700</div>
</div>
<div style="display:flex;gap:16px;align-items:center;height:40px;padding:0 12px;border-top:1px solid var(--border-hairline);color:var(--gray-600)">
--accent · --accent-hover · --accent-subtle <span style="background:var(--accent-subtle);color:var(--blue-600);padding:2px 8px">subtle fill</span>
</div></body></html>

<!-- @dsCard group="Spacing" viewport="700x150" subtitle="Sharp radii; borders carry structure" name="Radii & borders" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);padding:18px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head>
<body><div style="display:flex;gap:16px;align-items:flex-start">
<div><div style="width:110px;height:70px;background:var(--surface-card);border:1px solid var(--border-default)"></div>0 — terminal panels</div>
<div><div style="width:110px;height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-sm)"></div>2px — controls</div>
<div><div style="width:110px;height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-card)"></div>4px — cards (+shadow)</div>
<div><div style="width:110px;height:70px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay)"></div>6px — overlays</div>
</div>
<div style="margin-top:10px">1px borders everywhere · shadows: light mode only, whisper-subtle</div>
</body></html>

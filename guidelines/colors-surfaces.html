<!-- @dsCard group="Colors" viewport="700x160" subtitle="Semantic surfaces, light vs dark" name="Surfaces" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-mono);font-size:10px}</style></head>
<body><div style="display:grid;grid-template-columns:1fr 1fr;height:160px">
<div style="background:var(--surface-page);padding:12px">
  <div style="color:var(--text-muted);margin-bottom:8px">LIGHT — marketing default</div>
  <div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:10px;color:var(--text-primary)">--surface-card<div style="color:var(--text-secondary)">--text-secondary</div></div>
</div>
<div data-theme="dark" style="background:var(--surface-page);padding:12px">
  <div style="color:var(--text-muted);margin-bottom:8px">DARK — terminal [data-theme=dark]</div>
  <div style="background:var(--surface-card);border:1px solid var(--border-default);padding:10px;color:var(--text-primary)">--surface-card<div style="color:var(--text-secondary)">--text-secondary</div></div>
</div>
</div></body></html>

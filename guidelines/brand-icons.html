<!-- @dsCard group="Brand" viewport="700x160" subtitle="Lucide 1.5px stroke + mono unicode arrows" name="Iconography" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><script src="https://unpkg.com/lucide@latest"></script><style>body{margin:0;background:var(--surface-card);padding:18px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}i{width:20px;height:20px}</style></head>
<body>
<div style="display:flex;gap:22px;align-items:center;color:var(--text-primary)">
<i data-lucide="search"></i><i data-lucide="settings"></i><i data-lucide="bell"></i><i data-lucide="download"></i><i data-lucide="chevron-down"></i><i data-lucide="x"></i><i data-lucide="filter"></i><i data-lucide="shield-check"></i><i data-lucide="clock"></i>
<span style="font-size:14px"><span style="color:var(--up)">▲</span> <span style="color:var(--down)">▼</span></span>
</div>
<div style="margin-top:14px">Lucide · 16/20px · stroke 1.5 · currentColor · direction arrows are mono unicode, never icons</div>
<script>lucide.createIcons({attrs:{'stroke-width':1.5}})</script>
</body></html>
